[project]
name = "meridian-orchestrator"
version = "0.1.0"
description = "Internal infrastructure for Meridian AI's AI-staffed company operations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{name = "Meridian AI, LLC"}]
license = {text = "Proprietary"}
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "structlog>=24.1",
    "keyring>=25.0",
    "watchfiles>=0.21",
    "uvicorn>=0.30",
    # IANA timezone database for zoneinfo. Windows doesn't ship system tz
    # data in IANA format; macOS/Linux usually do, but we declare it
    # explicitly so the daemon's operator-local timestamp logging works
    # cross-platform without environment-detection code paths.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_orchestrator"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "ARG", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/meridian_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --strict-markers"
