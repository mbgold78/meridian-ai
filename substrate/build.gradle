plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}" apply false
    // C11 — frontend build wiring (kills the bundle-staleness trap, port-map Appendix #11).
    // Applied only by :app; downloads its own pinned Node so CI / Docker / local builds
    // never depend on a system Node install.
    id 'com.github.node-gradle.node' version "${nodeGradlePluginVersion}" apply false
}

allprojects {
    group = 'com.meridian.substrate'
    version = '0.1.0'

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

subprojects {
    // DOC-1 (plan §6 hazard 1): ':docs' is the Node-only docs capture
    // pipeline — applying the java conventions here would drag it into
    // `gradlew build` (CI's backend job). Its tasks are invoked explicitly
    // (docsCapture/docsAssemble/docsVerify) and never join build/check.
    if (name == 'docs') {
        return
    }

    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(javaVersion))
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-parameters'])
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Spring test-context cache (one Boot context per distinct property
        // set) outgrew the 512m worker default when the 6c gateway suites
        // landed — Governed3cAcceptanceTest OOMed building its
        // EntityManagerFactory. Same-shape suites share context keys where
        // possible; this is the headroom for the rest.
        maxHeapSize = '2g'
    }
}
