# Versions — pinned
springBootVersion=3.4.4
springDependencyManagementVersion=1.1.6
javaVersion=21
anthropicSdkVersion=2.25.0
# Official MCP Java SDK (engine-spec contracts.md §8.1) — pinned to the current
# stable line (2.0.0 is still RC as of 2026-06-10). mcp-core carries both the
# Streamable HTTP servlet server transport and the JDK HttpClient streamable
# client transport the §14.5 parity suite scripts against.
mcpSdkVersion=1.1.3
# C11 frontend wiring — node-gradle plugin + the Node toolchain it downloads
# (Node 22 LTS, matching the CI frontend job's setup-node pin).
nodeGradlePluginVersion=7.1.0
nodeVersion=22.14.0
# ShedLock (engine-spec contracts.md §5.2/§10.3) — leases the contract-monitor
# sweep via the V5 shedlock table (JDBC provider). 5.x is the stable
# Spring Boot 3 / Java 21 pairing.
shedlockVersion=5.16.0
# ArchUnit (engine-spec contracts.md §14.6) — the 3c architecture gate:
# governed-coverage rule, append-only repo rule, module rules, the
# @UngovernedModule ADR D3 exemption pin. H2/Docker-independent by design.
archunitVersion=1.3.0

# Gradle behavior
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
