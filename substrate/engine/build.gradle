plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    api project(':common')

    // Engine services are Spring components persisted via JPA
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring AOP + AspectJ — the §4.2 PEP-2 GovernedActionAspect
    // (engine-spec contracts.md §4.2/§9; ADR-002 D2). Transitively present via
    // spring-boot-starter-data-jpa already; declared explicitly because engine
    // source compiles against @Aspect/@Around directly.
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ShedLock — contract-monitor sweep lease (engine-spec contracts.md §5.2,
    // §10.3; ADR-002). JDBC provider rides the V5__contracts.sql shedlock
    // table; spring-jdbc arrives via spring-boot-starter-data-jpa.
    implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
    implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedlockVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}
