plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    // C11 — frontend build wiring (version pinned in root build.gradle / gradle.properties)
    id 'com.github.node-gradle.node'
}

dependencies {
    implementation project(':common')
    implementation project(':engine')

    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Phase 5 Stage 3 — observability (plan §8). All three are INERT by
    // default: management.otlp.metrics.export.enabled / management.tracing.enabled
    // map to substrate.observability.* keys (default false) in application.yml,
    // so no exporter/tracer beans exist until an engagement opts in (pinned by
    // ObservabilityExportToggleTest). Versions ride the Boot BOM
    // (micrometer/micrometer-tracing/opentelemetry BOM imports).
    implementation 'io.micrometer:micrometer-registry-otlp'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    // Phase 5 — generic OIDC resource server (production plan §4; port-map S9).
    // ACTIVE ONLY under substrate.auth.mode=oidc: in anonymous mode (dev default)
    // AuthModeEnvironmentPostProcessor excludes ALL security auto-configuration,
    // so the classpath addition is behavior-neutral for the existing suite.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Database — Postgres in production, H2 (PostgreSQL compatibility mode) for dev profile
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // MinIO blob store (C2 — MinioBlobStore; homepoc pin)
    implementation 'io.minio:minio:8.5.12'

    // Anthropic SDK
    implementation "com.anthropic:anthropic-java:${anthropicSdkVersion}"

    // Official MCP Java SDK (engine-spec contracts.md §8.1) — substrate-contracts
    // server: Streamable HTTP servlet transport mounted at /mcp by THIS module;
    // tool logic stays in engine services, so the SDK never enters engine's
    // java-library dependency graph. mcp-json-jackson2 binds the SDK to the
    // app's Jackson 2 ObjectMapper (Boot 3.4 BOM) instead of the SDK's default
    // Jackson 3 binding. The same artifacts provide the scripted
    // Streamable-HTTP client the §14.5 parity suite uses (test scope rides the
    // implementation dependency).
    implementation "io.modelcontextprotocol.sdk:mcp-core:${mcpSdkVersion}"
    implementation "io.modelcontextprotocol.sdk:mcp-json-jackson2:${mcpSdkVersion}"

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6'

    // Logging
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    // Phase 5 — JWT-mock suites (jwt() post-processor / SecurityMockMvc*): the
    // Docker-less local verification lane for oidc mode (plan §4 — Keycloak
    // itself only runs in CI via the Testcontainers IT).
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'

    // C11 — Testcontainers-Postgres integration lane (versions from the Boot BOM).
    // Suite self-disables without Docker (@Testcontainers(disabledWithoutDocker = true));
    // CI on ubuntu-latest is the real gate (port-map §4.4 / Appendix #4).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // ShedLock lease IT (engine-spec contracts.md §14.4): the lease is held /
    // released through the LockProvider API; engine keeps shedlock as
    // implementation (not exported), so the test classpath needs core itself.
    testImplementation "net.javacrumbs.shedlock:shedlock-core:${shedlockVersion}"

    // §14.6 ArchUnit suite (3c, runs in CI from day one; H2/Docker-independent):
    // governed-coverage rule over mutating methods, append-only repo rule,
    // module rules, @UngovernedModule ADR D3 pin. Ingestion classes join the
    // suite's IMPORT by filesystem location (see the test task below), NOT the
    // test classpath: ingestion is a separate bootable app carrying its own
    // application.yml + @EnableJpaRepositories — on the classpath it would
    // collide with the app context in every Spring test.
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
}

bootRun {
    if (project.hasProperty('profile')) {
        systemProperty 'spring.profiles.active', project.property('profile')
    }
}

// §14.6 — hand the ArchUnit suite the ingestion module's compiled classes by
// path (GovernedArchitectureTest imports them for the module rules + the
// ADR D3 @UngovernedModule pin without putting ingestion on the classpath).
tasks.named('test') {
    dependsOn ':ingestion:compileJava'
    systemProperty 'substrate.archunit.ingestion-classes',
            project(':ingestion').layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
}

// ---------------------------------------------------------------------------
// C11 — frontend → processResources wiring (port-map Appendix trap #11).
//
// Vite writes its bundle to app/src/main/resources/static (emptyOutDir=true,
// see frontend/vite.config.ts). Without this wiring a running Boot app serves
// build/resources/main/static — homepoc's documented bundle-staleness trap.
// Making processResources depend on the frontend build guarantees that
// `gradlew :app:bootJar` (and plain `gradlew build`) ALWAYS embeds a bundle
// freshly built from frontend/src.
//
// Node itself is downloaded by the node-gradle plugin (pinned in
// gradle.properties), so this works identically on this Windows dev machine,
// GitHub Actions ubuntu runners, and inside the Dockerfile build stage —
// no system Node required anywhere.
// ---------------------------------------------------------------------------
def frontendDir = file("${rootProject.projectDir}/frontend")

node {
    download = true
    version = nodeVersion
    // npm ci (not install) — reproducible installs from package-lock.json
    npmInstallCommand = 'ci'
    nodeProjectDir = frontendDir
    // Keep downloaded toolchains out of the frontend tree (vite/tsc must not see them)
    workDir = file("${rootProject.projectDir}/.gradle/nodejs")
    npmWorkDir = file("${rootProject.projectDir}/.gradle/npm")
}

tasks.register('frontendBuild', com.github.gradle.node.npm.task.NpmTask) {
    description = 'Builds the frontend bundle (tsc && vite build) into app/src/main/resources/static'
    group = 'build'
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    // Up-to-date checking: rebuild only when frontend sources/config change
    inputs.dir(file("${frontendDir}/src"))
    inputs.files(
            "${frontendDir}/index.html",
            "${frontendDir}/package.json",
            "${frontendDir}/package-lock.json",
            "${frontendDir}/vite.config.ts",
            "${frontendDir}/tsconfig.json",
            "${frontendDir}/tsconfig.node.json",
            "${frontendDir}/tailwind.config.ts",
            "${frontendDir}/postcss.config.js",
            "${frontendDir}/components.json"
    )
    outputs.dir(file("${projectDir}/src/main/resources/static"))
}

// -PskipFrontendBuild is for the Dockerfile ONLY: its dedicated frontend stage
// (node:22.14.0-alpine, same nodeVersion pin) already built the bundle and
// overlaid it into app/src/main/resources/static, so the gradle-side wiring
// must not re-download Node inside the image build. Every other invocation
// (dev, CI backend job) omits the property and keeps the C11 guarantee.
if (!project.hasProperty('skipFrontendBuild')) {
    tasks.named('processResources') {
        dependsOn tasks.named('frontendBuild')
    }
}
