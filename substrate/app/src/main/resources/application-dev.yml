# Dev profile — runs with zero external dependencies (no Docker required).
# H2 in PostgreSQL compatibility mode so Flyway migrations stay Postgres-shaped.
spring:
  datasource:
    url: jdbc:h2:mem:substrate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

substrate:
  auth:
    # Anonymous-allowed mode until real OIDC wiring (production plan §4).
    mode: anonymous
  blob-store:
    # Dev fallback (C2): local filesystem store under build/blob-store.
    # Without it the no-op UnconfiguredBlobStore is used (boot fine, asset upload 500s).
    provider: local
  # DemoPack seeding (C10): deliberately NOT enabled here. DemoSeedDisabledTest pins the
  # safe default (seed=false) under the dev profile, and seeding would pollute the shared
  # dev-profile H2 test context. Demo boot enables it explicitly:
  #   gradlew :app:bootRun --args="--spring.profiles.active=dev --substrate.demo.seed=true"
  # demo:
  #   seed: true
  dna:
    # Phase-1 demo engagement identity (C3, fixture seam S10). Code defaults are neutral;
    # these dev-profile values restore homepoc demo parity.
    project-name: 'Meridian Bancorp · Risk Consolidation'
    domain: operational-risk
    primary-objective: >-
      Identify redundant systems and manual processes that can be consolidated
      or eliminated to reduce operational risk and cost.
    regulatory-context:
      - SR 11-7
      - Basel III OpRisk
      - SOX controls
