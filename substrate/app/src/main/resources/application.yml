spring:
  application:
    name: meridian-substrate
  profiles:
    default: dev
  servlet:
    multipart:
      # port-map §2.2 multipart 5MB limits — cross-cutting web config needed by C2 branding uploads
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # common = ANSI-portable migrations; {vendor} = dialect-specific (postgresql / h2 for dev)
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}

management:
  # Web exposure (management.endpoints.web.exposure.include) is deliberately
  # NOT set here — ObservabilityEnvironmentPostProcessor computes the per-auth-mode
  # default (anonymous: health,info — oidc: health,info,metrics behind the admin
  # role; substrate.observability.actuator.expose=true widens anonymous mode for
  # local debugging). Any explicit value (env var, profile YAML, command line)
  # wins over the computed default.
  endpoint:
    health:
      probes:
        enabled: true
  # ---- Stage 3 OTLP export mappings (plan §8) — driven entirely by the
  # substrate.observability.* keys below; nothing is exported until an
  # engagement flips substrate.observability.enabled=true.
  otlp:
    metrics:
      export:
        enabled: ${substrate.observability.enabled}
        url: ${substrate.observability.otlp.endpoint}/v1/metrics
        step: ${substrate.observability.otlp.step}
    tracing:
      endpoint: ${substrate.observability.otlp.endpoint}/v1/traces
  tracing:
    enabled: ${substrate.observability.tracing.enabled}
    sampling:
      probability: ${substrate.observability.tracing.sample-probability}
  metrics:
    tags:
      # Per-engagement isolation posture (plan §8): every meter carries the
      # engagement id so a customer's stack can prove single-tenancy.
      engagement: ${substrate.engagement.id}
  opentelemetry:
    resource-attributes:
      engagement: ${substrate.engagement.id}

server:
  port: 8080
  shutdown: graceful

substrate:
  # Phase 5 auth-mode ladder (production plan §4; docs/auth.md). Code default is
  # 'anonymous' (AuthProperties) — pre-Phase-5 behavior byte-for-byte, NO Spring
  # Security on the request path. 'oidc' = generic OIDC resource server: any
  # conformant IdP via substrate.auth.oidc.issuer-uri (customer brings the IdP;
  # Keycloak is the throwaway test IdP — see application-postgres.yml +
  # infra/keycloak/realm-substrate.json). All claim/role/persona mappings are
  # per-engagement config under substrate.auth.oidc.* — never code.
  # auth:
  #   mode: anonymous
  # ---- Phase 5 Stage 3 — observability (plan §8; docs/observability.md).
  # OFF by default: no OTLP exporter beans, no tracer, zero export overhead.
  # A customer engagement points substrate at THEIR collector with env vars:
  #   SUBSTRATE_OBSERVABILITY_ENABLED=true
  #   SUBSTRATE_OBSERVABILITY_OTLP_ENDPOINT=http://otel-collector:4318
  # Collector auth headers (when required) are env-refs via the standard Boot
  # keys (management.otlp.metrics.export.headers.* /
  # management.otlp.tracing.headers.*) — secrets never land in the repo.
  observability:
    # Master switch: OTLP metric export + (unless overridden below) tracing.
    enabled: ${SUBSTRATE_OBSERVABILITY_ENABLED:false}
    otlp:
      # Collector base URL (OTLP/HTTP); /v1/metrics and /v1/traces are appended.
      endpoint: ${SUBSTRATE_OBSERVABILITY_OTLP_ENDPOINT:http://localhost:4318}
      # Metric export interval.
      step: ${SUBSTRATE_OBSERVABILITY_OTLP_STEP:60s}
    tracing:
      # Follows the master switch unless pinned per engagement.
      enabled: ${SUBSTRATE_OBSERVABILITY_TRACING_ENABLED:${substrate.observability.enabled}}
      sample-probability: ${SUBSTRATE_OBSERVABILITY_TRACE_SAMPLE:0.1}
    actuator:
      # Anonymous-mode opt-in ONLY (local debugging): exposes /actuator/metrics
      # without auth. Under oidc the metrics endpoints are exposed and gated on
      # the substrate.auth.oidc.admin-roles instead — never set this in a
      # customer engagement build.
      expose: ${SUBSTRATE_OBSERVABILITY_ACTUATOR_EXPOSE:false}
  # Filesystem roots (bind AppProperties; kebab-case — homepoc's dotted 'meridian.data.dir'
  # style never bound via relaxed binding, see AppProperties javadoc)
  data-dir: ./data
  uploads-dir: ./uploads
  staging-dir: ./staging
  demo:
    # C10 flips this true in the dev/demo profile
    seed: false
    # substrate.demo.fixed-clock (UNSET by default — key documented only):
    # ISO-8601 instant pinning the shared engine java.time.Clock (S15 demo
    # determinism; the §13 3b acceptance lever). Example:
    #   --substrate.demo.fixed-clock=2026-05-12T00:00:00Z
    # Never set in a customer engagement build.
    contracts:
      # DemoPack-only (engine-spec contracts.md §1/§14.2): records fixture
      # acceptances to flip co-tribal-knowledge-depopulation ACTIVE for
      # monitor demos. Effective only when substrate.demo.seed=true.
      activate: false
      # DemoPack-only (§13 row 3c / spec §16): seeds + activates the SYNTHETIC
      # guard-bearing contract demo-gateway-guards (agent.promote +
      # contract.report_metric DENY guards; agent-fleet party bound to MCP
      # principal 'demo-agent') — the 3c acceptance lever. Both fixture
      # contracts compile to zero guards by design; never enable in a
      # customer engagement build. Effective only when substrate.demo.seed=true.
      guards: false
  cors:
    # Binds CorsProperties; YAML list or comma-separated string both accepted
    allowed-origins: http://localhost:5173,http://localhost:8080
  engagement:
    id: ${SUBSTRATE_ENGAGEMENT_ID:dev-engagement}
    # Surfaced as AssistantService projectName (fixture seam S10). Env-overridable;
    # fallback matches the @Value code default pinned by C1EndpointInventoryTest.
    display-name: ${SUBSTRATE_ENGAGEMENT_DISPLAY_NAME:Substrate Engagement}
  transformation:
    # S4 fixture seam — serves the 31.6KB fictional transformation-plan mockup when true.
    # MUST stay false in any customer engagement build (port-map Appendix trap 9 analog).
    # Demo runs may override: --substrate.transformation.fixture-enabled=true
    fixture-enabled: false
  blob-store:
    # provider is profile-set: 'local' in dev (application-dev.yml); 'minio' when a
    # MinIO service exists (see application-postgres.yml). Unset => UnconfiguredBlobStore
    # (boot fine; branding asset upload 500s with a clear message).
    default-bucket: substrate-dev
    local:
      base-dir: build/blob-store
  decision-log:
    # Boot-time hash-chain re-verification (C4). Code default is true; key is documentation.
    verify-on-boot: true
  stats:
    # D5 computed statistics (engine-spec diagnostic.md §2/§12; ADR-004 D13).
    # stall-threshold-days: §12.1 lifecycle-stall dwell threshold — the fixture's
    # "90+ days" one-liner as a config knob; first-engagement calibration item.
    stall-threshold-days: 90
    # pattern-window-days DOCUMENTS the §12.2 trailing window, which is DELEGATED
    # to contracts §11.2 (ContractSignalService.COORDINATION_WINDOW owns it —
    # "the window stays theirs"); never wired into a portfolio-side computation.
    pattern-window-days: 7
  # substrate.eval.enabled / substrate.eval.run (C3) default false in code — no entry needed.
  # Eval harness run: gradlew :app:bootRun --args="--substrate.eval.enabled=true --substrate.eval.run=true --substrate.llm.provider=mock"
  # substrate.engine.tools.dispatch-pool-size (C3) defaults to 8 in code; persona-access
  # allow/deny lists default to homepoc's persona→tool allowlist — override only per engagement.
  orchestrator:
    # MCP seam to the sibling orchestrator product. Absent => degraded mode (no AI assist):
    # POST /api/v1/cascade-drafts/{id}/suggest is 404, everything else unaffected (ADR-001 D14).
    enabled: ${SUBSTRATE_ORCHESTRATOR_ENABLED:false}
    base-url: ${SUBSTRATE_ORCHESTRATOR_URL:}
  cascade:
    # Escalation sweeper (engine-spec cascade.md §9, ADR-001 D5): notification-ONLY,
    # never a state transition. Values mirror the CascadeProperties code defaults —
    # first-engagement calibration items. Per-cascade responseSlaDays=0 disables the SLA.
    default-response-sla-days: 7
    overdue-renotify-days: 3
    overdue-renotify-limit: 5
    sweep-cron: "0 0 * * * *"
  contracts:
    # Coordination-contract engine (engine-spec contracts.md §1; ADR-002).
    # Values mirror the spec defaults; behavior beans land in chunks 3a/3b/3c.
    enforcement:
      # off = gateway skipped (counter only); shadow = full evaluation,
      # would-be denials logged WOULD_DENY, nothing blocked; enforce = DENY
      # blocks. Per-engagement; ship shadow, flip after a clean window (ADR D4).
      mode: shadow
    decision-log:
      # matched-only: row only decisions where >=1 guard matched (plus all
      # FLAG/DENY/WOULD_DENY); plain no-guard ALLOWs are metrics counters.
      # 'all': row everything. (ADR D17)
      level: matched-only
    monitor:
      # Master switch for the scheduler sweep.
      enabled: true
      # Fixed-delay of the sweep (claims monitors whose next_run_at <= now).
      sweep-interval: PT60S
    clock:
      # Zone for period-key computation. Injectable java.time.Clock bean
      # everywhere (demo determinism per S15).
      zone: UTC
    trace:
      # Cap on persisted monitor-run trace JSON; truncate with a
      # {"truncated": true} marker.
      max-bytes: 16384
    types:
      # Validated allowlist for contract_type (ADR D15).
      allowlist: cross-portfolio-opportunity, federation-invitation
    mcp:
      # Mounts the substrate-contracts MCP server at /mcp (chunk 3a read tools).
      enabled: true
    # When true AND substrate.orchestrator.enabled, breach SURFACED may submit
    # a remediation task via orchestrator submit_task. Off by default.
    orchestrator-remediation: false
  llm:
    provider: anthropic
    anthropic:
      # Blank/absent => degraded mode (no SDK client bean); the app boots fine.
      api-key: ${ANTHROPIC_API_KEY:}
      # REQUIRED here: code deliberately has no hardcoded model (port-map §2.2).
      # Absent model fails loudly at call time (IllegalStateException), never at boot.
      model: ${SUBSTRATE_LLM_MODEL:claude-opus-4-8}
      max-tokens: 4096
      timeout-ms: 120000
    tools:
      max-calls-per-request: 5
      dispatch-timeout-ms: 10000
    cost:
      # USD per million tokens — carried from homepoc; verify against current
      # pricing for the configured model before any real cost reporting.
      input-rate-per-million: 15.00
      output-rate-per-million: 75.00
    # safety.refusal-fallback-message intentionally omitted — safe Java default exists.
