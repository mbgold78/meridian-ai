# DOC-1 selector registry — RESERVED names (plan §4, rulings P-2/P-3; S5).
#
# This file is the CONTRACT a future feature PR claims. Every name below is
# reserved for a UI surface or verb that DOES NOT EXIST in the frontend today.
# Reserving the name here (instead of stubbing inert DOM) keeps DOC-1's
# zero-production-change constraint AND gives the docs suite a stable
# vocabulary: the pre-written `status: blocked` capture specs and the
# `status: blocked-on-ui` stub topics in docs/guides/{coo,operator}/not-yet/
# reference these names by spelling.
#
# Rules of the contract:
#   1. A feature PR that builds one of these surfaces MUST use the reserved
#      name exactly (data-testid / data-* attribute as stated), move the
#      entry from `reserved:` to `shipped:` in this file, flip the paired
#      capture spec to `status: active`, and replace the stub topic with the
#      real guide task — all in the same PR. The docs gate (docsVerify) then
#      starts protecting the new surface mechanically.
#   2. Nothing in this file may be silently renamed: specs and stub topics
#      spell these names, and `:docs` schema validation + the S6 CI hint job
#      key on this registry.
#   3. The pipeline never loads this file as a capture spec (loadSpecs
#      excludes `selector-registry*` by name).
#
# Conventions: kind `testid` = data-testid value; kind `data-attr` = a
# machine-readable data-* attribute riding a testid'd element (P-3: stable
# keys, never per-boot UUIDs).

version: 1

