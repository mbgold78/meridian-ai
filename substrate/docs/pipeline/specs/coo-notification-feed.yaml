# (ruling P-2): a push-style notification feed. Until it ships, the
# dashboard's attention-ordered cards ARE the feed (coo/01-dashboard).
id: coo-notification-feed
title: Notification feed — decline-pending, breach, and intervention events
topic: coo/not-yet/notification-feed
status: blocked
statusReason: >-
  No notification feed exists anywhere in the frontend. RESERVED names in
  specs/selector-registry.yaml: notification-feed, notification-item
  (+ data-kind). The feature PR decides its chrome home, claims the names,
  and flips this spec.
route: /portfolio/dashboard
persona: L1_EXECUTIVE
viewport: { width: 1536, height: 3400 }
waits:
