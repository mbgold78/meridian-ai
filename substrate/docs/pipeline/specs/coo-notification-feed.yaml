  - selector: '[data-banner-provenance="live"]'
  - selector: '[data-testid="notification-feed"]'
  - selector: '[data-testid="notification-item"]'
capture: { mode: element, selector: '[data-testid="notification-feed"]' }
output: coo-notification-feed.png
determinism: seeded
