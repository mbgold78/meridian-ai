# Plan §3 worked example (complex: pre-step + callouts) — S2 FINAL FORM.
#
# S1 shipped this spec on name-based/aria shims because the testids did not
# exist yet; S2 lands the additive attributes (plan §4 items 30/31/33/35) and
# swaps every selector to the §3 originals:
#   [data-agents-source="live"]                  — the agents-specific
#       provenance marker (plan addition): the ONLY way the spec can refuse
#       the silent live→fixture fallback on this surface (agentData.ts).
#       S1's banner-level [data-banner-provenance="live"] proved the stats
#       API only.
#   [data-testid="agent-row"][data-agent-key="a-pre-visit"] — agent_key is
#       seed-stable fixture parity (AgentFleetRowDto.id ← agent_key), never a
#       per-boot UUID (P-3).
#   [data-testid="agent-deployment-panel"], [data-testid="finding-card"] —
#       replace the role/aria and class-coupled S1 shims.
id: subsidiary-operations
title: Operations tab — agent fleet with deployment detail expanded
topic: operator/06-agent-lifecycle#observe-in-ui
route: /portfolio/subsidiary/curasync-clinical?tab=operations   # slug + ?tab= are boot-stable
persona: L3_ANALYST
localStorage: { substrate-canvas-welcomed-v1: "1" }
# The app shell scrolls in an INNER container (PortfolioLayout h-screen), so
# fullPage capture equals the viewport — a 960px viewport cuts the findings
# section off and strands callout 3 outside the canvas. Tall viewport renders
# the whole operations scene scroll-free (plan §5 scrollbar row: fixed
# viewport, element-crop/etc. where inner scroll is unavoidable).
viewport: { width: 1536, height: 2000 }
waits:
  - api: { get: /api/v1/domains, until: { path: "$.data.length", equals: 23 }, timeoutMs: 60000 }
  - selector: '[data-agents-source="live"]'     # live-mode assertion (plan §4 item 35)
  - selector: '[data-testid="agent-row"][data-agent-key="a-pre-visit"]'
preSteps:
  - click: '[data-testid="agent-row"][data-agent-key="a-pre-visit"]'
  - waitSelector: '[data-testid="agent-deployment-panel"]'
capture: { mode: fullPage }
annotations:
  - { n: 1, anchor: '[data-testid="agent-row"][data-agent-key="a-pre-visit"]',
      offset: { x: -18, y: 4 }, text: "Lifecycle badge: Operating / Shadow / In intervention / Paused" }
  - { n: 2, anchor: '[data-testid="agent-deployment-panel"]',
      offset: { x: -18, y: 8 }, text: "Deployment detail: criteria and oversight chain" }
  - { n: 3, anchor: '[data-testid="finding-card"]',
      offset: { x: -18, y: 4 }, text: "Open finding — 'Surfaced N days ago' is fixture-clock-pinned" }
output: 08-subsidiary-operations.png
determinism: seeded
