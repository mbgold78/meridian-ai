# Plan §3 worked example (complex: pre-step + callouts) — S1 VARIANT.
#
# S1 deviation (plan §2: S1 pilots use only EXISTING selectors; the testids in
# the §3 worked example land in S2): every selector below targets markup that
# ships today. S2 swaps them for the §3 originals once the additive testids
# exist:
#   [data-agents-source="live"]                  <- today: [data-banner-provenance="live"]
#                                                   (layout-level live marker — proves the
#                                                   stats API is live, NOT the agents call;
#                                                   the agents-specific marker is the §4
#                                                   plan-addition attr, S2)
#   [data-testid="agent-row"][data-agent-key=..] <- today: button[aria-label="Expand/Collapse
#                                                   Pre-Visit Intake Assistant deployment detail"]
#                                                   (name-based; seed-stable: name + deployedAt
#                                                   come from demopack/beacon-agents.json and the
#                                                   seeder's stepping fixed clock)
#   [data-testid="agent-deployment-panel"]       <- today: [role="region"][aria-label="Pre-Visit
#                                                   Intake Assistant deployment detail"]
#   [data-testid="finding-card"]                 <- today: section[aria-label="Operations"]
#                                                   article.bg-surface-raised (class-coupled;
#                                                   acceptable only as an S1 pilot shim)
id: subsidiary-operations
title: Operations tab — agent fleet with deployment detail expanded
topic: operator/06-agent-lifecycle#observe-in-ui
route: /portfolio/subsidiary/curasync-clinical?tab=operations   # slug + ?tab= are boot-stable
persona: L3_ANALYST
localStorage: { substrate-canvas-welcomed-v1: "1" }
# The app shell scrolls in an INNER container (PortfolioLayout h-screen), so
# fullPage capture equals the viewport — a 960px viewport cuts the findings
# section off and strands callout 3 outside the canvas. Tall viewport renders
# the whole operations scene scroll-free (plan §5 scrollbar row: fixed
# viewport, element-crop/etc. where inner scroll is unavoidable).
viewport: { width: 1536, height: 2000 }
waits:
  - api: { get: /api/v1/domains, until: { path: "$.data.length", equals: 23 }, timeoutMs: 60000 }
  - selector: '[data-banner-provenance="live"]'   # S1 live-mode assertion (see header note)
  - selector: 'button[aria-label="Expand Pre-Visit Intake Assistant deployment detail"]'
preSteps:
  - click: 'button[aria-label="Expand Pre-Visit Intake Assistant deployment detail"]'
  - waitSelector: '[role="region"][aria-label="Pre-Visit Intake Assistant deployment detail"]'
capture: { mode: fullPage }
annotations:
  - { n: 1, anchor: 'button[aria-label="Collapse Pre-Visit Intake Assistant deployment detail"]',
      offset: { x: -18, y: 4 }, text: "Lifecycle badge: Operating / Shadow / In intervention / Paused" }
  - { n: 2, anchor: '[role="region"][aria-label="Pre-Visit Intake Assistant deployment detail"]',
      offset: { x: -18, y: 8 }, text: "Deployment detail: criteria and oversight chain" }
  - { n: 3, anchor: 'section[aria-label="Operations"] article.bg-surface-raised',
      offset: { x: -18, y: 4 }, text: "Open finding — 'Surfaced N days ago' is fixture-clock-pinned" }
output: 08-subsidiary-operations.png
determinism: seeded
