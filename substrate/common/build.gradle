plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // JPA entities
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Validation
    api 'org.springframework.boot:spring-boot-starter-validation'

    // Jackson for JSON columns
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Reactive types for streaming
    api 'io.projectreactor:reactor-core'

    // Anthropic SDK (shared AI client interfaces)
    api "com.anthropic:anthropic-java:${anthropicSdkVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // H2 (PostgreSQL compatibility mode) backs RepositorySmokeTest's @DataJpaTest (B1 request)
    testRuntimeOnly 'com.h2database:h2'
}
