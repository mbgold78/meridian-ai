<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Meridian Substrate">
  <!-- Meridian Substrate mark: geometric globe with prime meridian + longitude arc.
       Original artwork, brand palette from tailwind.config.ts (brand.400/500/300). -->
  <circle cx="32" cy="32" r="30" fill="#0b1726"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="22" stroke="#0c93e9" stroke-width="3"/>
    <line x1="32" y1="10" x2="32" y2="54" stroke="#36adf8" stroke-width="3"/>
    <ellipse cx="32" cy="32" rx="11" ry="22" stroke="#36adf8" stroke-width="3" stroke-opacity="0.7"/>
    <line x1="10" y1="32" x2="54" y2="32" stroke="#7cc8fc" stroke-width="2" stroke-opacity="0.45"/>
  </g>
</svg>
