plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':common')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database — Postgres in production, H2 for dev profile
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Flyway — the ingestion CLI migrates the engagement DB itself (shared
    // migration classpath, see processResources below)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // CSV parsing
    implementation 'com.opencsv:opencsv:5.9'

    // Anthropic SDK
    implementation "com.anthropic:anthropic-java:${anthropicSdkVersion}"

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'

    // Diagnostic e2e gate (engine-spec diagnostic.md §11.3): the single-JVM
    // ingest→diagnose pipeline IT needs the diagnostic engine on the TEST
    // classpath only. Ingestion MAIN still depends solely on :common — the
    // §14.6 ArchUnit module rule ("ingestion never imports engine or app")
    // imports ingestion's compiled MAIN classes and stays binding.
    testImplementation project(':engine')

    // Testcontainers-Postgres lane (suite self-disables without Docker;
    // CI on ubuntu-latest is the real gate — H2-green is never acceptance).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

// Chunk I1 decision (port-map §2.4 datasource note): the ingestion CLI SHARES the
// app module's migration classpath instead of requiring an app boot to have
// migrated first. Identical files → identical Flyway checksums, so app and
// ingestion can both run Flyway against the same database safely.
processResources {
    from(project(':app').file('src/main/resources/db/migration')) {
        into 'db/migration'
    }
}
