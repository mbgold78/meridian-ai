name: substrate-ci

on:
  push:
    branches: [main]
    paths: ["substrate/**", ".github/workflows/substrate-ci.yml"]
  pull_request:
    paths: ["substrate/**", ".github/workflows/substrate-ci.yml"]

defaults:
  run:
    working-directory: substrate

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: substrate/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: substrate/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t meridian-substrate:${{ github.sha }} .
